<body>
  <div id="tabs" class="scrollbar">
    <div id="tabs_container">

    </div>
    <button id="add_tab">+</button>
  </div>
  <div id="editor"></div>

  <div id="toolbar">
    <div class="button" id="copy">
      <img src="./assets/icons/copy_3_line.svg" alt="copy">
      <span>&nbsp;Copy</span>
    </div>
    <div class="button" id="info">
      <img src="./assets/icons/information_line.svg" alt="info">
      <span>&nbsp;Info</span>
    </div>
    <div class="button" id="change_logs">
      <img src="./assets/icons/notebook_2_line.svg" alt="info">
      <span>&nbsp;Change Logs</span>
    </div>
  </div>


  <div id="info_modal" class="modal">
    <div id="info_modal_container" class="container">
      <p>
        Creator: <a href="https://makar-ts.github.io/">Makar-Ts</a><br>

        Author: <a href="https://github.com/snowflake0s">Joshua Eah "SnoWFLakE0s"</a>
      </p><br>

      </p>

    </div>

  <div id="change_logs_modal" class="modal">
    <div id="change_logs_modal_container" class="container">
      <button id="close_change_logs_modal" class="close">×</button>

      <div id="change_logs_modal_logs" class="scrollbar">

      </div>
    </div>
  </div>


  <script type="module" src="./index.js"></script>
